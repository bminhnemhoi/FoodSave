<!doctype html>
<html lang="vi">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #faf7f0;
      font-family: Arial, Helvetica, sans-serif;
      color: #13261e;
    "
  >
    <table
      role="presentation"
      width="100%"
      style="
        max-width: 520px;
        margin: 0 auto;
        background: #fffdf8;
        border: 1px solid #e6dfd0;
        border-radius: 14px;
      "
    >
      <tr>
        <td style="padding: 28px">
          <p style="margin: 0 0 20px; font-size: 22px; font-weight: 700">
            <span style="color: #13261e">FOOD</span><span style="color: #1b6b47">SAVE</span>
          </p>
          <h1 style="margin: 0 0 12px; font-size: 20px">Đặt lại mật khẩu</h1>
          <p style="margin: 0 0 20px; line-height: 1.6; color: #4a5b53">
            Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản FoodSave gắn với email này.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
              style="
                display: inline-block;
                background: #1b6b47;
                color: #ffffff;
                text-decoration: none;
                font-weight: 700;
                padding: 12px 20px;
                border-radius: 10px;
              "
            >
              Đặt mật khẩu mới
            </a>
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5f7068">
            Liên kết có hiệu lực trong 15 phút. Nếu bạn không yêu cầu, hãy bỏ qua email này — mật khẩu của bạn
            vẫn giữ nguyên.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
