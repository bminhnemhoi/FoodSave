name: Supabase keepalive

# Supabase gói Free tạm dừng project sau 7 ngày không hoạt động (DEPLOYMENT.md).
on:
  schedule:
    - cron: "17 1 * * *" # 08:17 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [STAGING, PROD]
    steps:
      - name: Ping ${{ matrix.target }}
        env:
          URL: ${{ secrets[format('SUPABASE_{0}_URL', matrix.target)] }}
          KEY: ${{ secrets[format('SUPABASE_{0}_ANON_KEY', matrix.target)] }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Chưa cấu hình secret cho ${{ matrix.target }} — bỏ qua."; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/rpc/healthcheck" \
            -X POST -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          # 200 khi đã có RPC healthcheck; 404 vẫn chứng tỏ project đang chạy và có truy cập DB/API
          [ "$code" = "200" ] || [ "$code" = "404" ]
